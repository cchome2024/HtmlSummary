<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Summary Archive{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALElK"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --app-bg: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        --app-bg-overlay: radial-gradient(circle at top right, rgba(59, 130, 246, 0.12), transparent 55%), radial-gradient(circle at bottom left, rgba(129, 140, 248, 0.14), transparent 50%);
        --app-surface: rgba(255, 255, 255, 0.95);
        --app-border: rgba(226, 232, 240, 0.6);
        --app-text: #1f2937;
        --app-text-muted: #64748b;
        --app-accent: #2563eb;
        --app-card-shadow: 0 24px 48px -28px rgba(15, 23, 42, 0.28);
      }

      body {
        background: var(--app-bg);
        overflow-x: hidden;
        color: var(--app-text);
        font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: var(--app-bg-overlay);
        opacity: 0.9;
      }

      a {
        color: var(--app-accent);
        text-decoration: none;
      }

      a:hover {
        color: #1d4ed8;
      }

      .app-shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 42px 24px 56px;
        position: relative;
        z-index: 1;
      }

      .app-header {
        background: var(--app-surface);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 32px;
        padding: 34px;
        margin-bottom: 36px;
        box-shadow: var(--app-card-shadow);
        backdrop-filter: blur(6px);
        position: relative;
        overflow: hidden;
      }

      .app-header::after {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        right: -60px;
        top: -80px;
        background: radial-gradient(circle, rgba(37, 99, 235, 0.12) 0%, rgba(37, 99, 235, 0) 65%);
      }

      .app-header .eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--app-text-muted);
        font-weight: 600;
      }

      .app-header h1 {
        font-size: clamp(1.6rem, 3vw, 2.1rem);
        font-weight: 700;
        margin: 0.45rem 0 0.75rem;
      }

      .app-header p {
        margin-bottom: 0;
        color: var(--app-text-muted);
      }

      .header-action .btn {
        border-radius: 999px;
        padding: 0.65rem 1.6rem;
        font-weight: 600;
      }

      .app-main {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .app-card {
        background: #ffffff;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        padding: 30px;
        box-shadow: 0 28px 55px -38px rgba(30, 41, 59, 0.55);
      }

      .app-card h2,
      .app-card h3 {
        color: var(--app-text);
      }

      .app-table thead th {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--app-text-muted);
        border-bottom: 1px solid var(--app-border);
        background-color: transparent;
      }

      .app-table tbody td {
        vertical-align: middle;
        border-color: rgba(226, 232, 240, 0.7);
      }

      .app-table tbody tr:hover {
        background: #f8fafc;
      }

      .text-snippet {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 0.95rem;
        color: var(--app-text);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 0.32rem 0.75rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.2s ease, color 0.2s ease, border 0.2s ease;
        border: 1px solid transparent;
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chip + .chip {
        margin-left: 0.4rem;
      }

      .chip-link {
        background: #dbeafe;
        color: #1d4ed8;
        border-color: rgba(37, 99, 235, 0.12);
      }

      .chip-link:hover {
        background: #bfdbfe;
        color: #1e40af;
      }

      .chip-neutral {
        background: #e2e8f0;
        color: #334155;
        border-color: rgba(71, 85, 105, 0.1);
      }

      .info-title {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--app-text-muted);
        margin-bottom: 0.5rem;
      }

      .info-panel {
        background: #f8fafc;
        border: 1px solid var(--app-border);
        border-radius: 16px;
        padding: 1rem 1.25rem;
      }

      .snippet-block {
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 14px;
        border: none;
        padding: 1rem 1.25rem;
        max-height: 260px;
        overflow: auto;
        font-size: 0.92rem;
      }

      .preview-frame {
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 20px;
        overflow: hidden;
        background: #ffffff;
        box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.02);
      }

      .preview-frame iframe {
        width: 100%;
        min-height: 650px;
        border: 0;
      }

      .empty-state {
        padding: 4rem 2rem;
        text-align: center;
      }

      .empty-state-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 1.5rem;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.12), rgba(99, 102, 241, 0.18));
        color: #1d4ed8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.85rem;
        box-shadow: inset 0 0 0 1px rgba(29, 78, 216, 0.12);
      }

      .btn-ghost-danger {
        border: 1px solid rgba(239, 68, 68, 0.18);
        color: #dc2626;
        background: rgba(248, 113, 113, 0.08);
        transition: all 0.2s ease;
      }

      .btn-ghost-danger:hover,
      .btn-ghost-danger:focus {
        color: #b91c1c;
        background: rgba(248, 113, 113, 0.18);
        border-color: rgba(185, 28, 28, 0.28);
        box-shadow: 0 8px 16px -12px rgba(220, 38, 38, 0.6);
      }

      .btn-ghost-danger:disabled {
        opacity: 0.65;
        box-shadow: none;
      }

      .action-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.1em;
        height: 1.1em;
        margin-right: 0.35rem;
      }

      @media (max-width: 768px) {
        .app-shell {
          padding: 20px 18px 42px;
        }

        .app-header {
          padding: 24px;
          border-radius: 20px;
        }

        .app-card {
          padding: 20px;
          border-radius: 20px;
        }

        .chip + .chip {
          margin-left: 0;
          margin-top: 0.4rem;
        }

        .btn-ghost-danger {
          width: 100%;
        }
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap">
          <div>
            <div class="eyebrow">Summary Archive</div>
            <h1>摘要存档服务</h1>
            <p>归档生成的摘要，快速检索相关网址与附件，便于复用与协作。</p>
          </div>
          <div class="header-action text-nowrap">
            {% block header_actions %}
              <a class="btn btn-outline-primary btn-lg" href="{{ url_for('index') }}">摘要列表</a>
            {% endblock %}
          </div>
        </div>
      </header>
      <main class="app-main">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
