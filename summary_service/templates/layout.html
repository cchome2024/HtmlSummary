<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Summary Archive{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALElK"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --app-bg: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        --app-surface: rgba(255, 255, 255, 0.94);
        --app-border: rgba(226, 232, 240, 0.7);
        --app-text: #1f2937;
        --app-text-muted: #64748b;
        --app-accent: #2563eb;
        --app-card-shadow: 0 18px 40px -24px rgba(15, 23, 42, 0.35);
      }

      body {
        background: var(--app-bg);
        color: var(--app-text);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        min-height: 100vh;
      }

      a {
        color: var(--app-accent);
      }

      a:hover {
        color: #1d4ed8;
      }

      .app-shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 36px 24px 48px;
      }

      .app-header {
        background: var(--app-surface);
        border: 1px solid var(--app-border);
        border-radius: 28px;
        padding: 32px;
        margin-bottom: 32px;
        box-shadow: var(--app-card-shadow);
        backdrop-filter: blur(6px);
      }

      .app-header .eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--app-text-muted);
        font-weight: 600;
      }

      .app-header h1 {
        font-size: clamp(1.6rem, 3vw, 2rem);
        font-weight: 700;
        margin: 0.4rem 0 0.75rem;
      }

      .app-header p {
        margin-bottom: 0;
        color: var(--app-text-muted);
      }

      .app-main {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .app-card {
        background: #ffffff;
        border: 1px solid var(--app-border);
        border-radius: 22px;
        padding: 28px;
        box-shadow: 0 20px 35px -28px rgba(30, 41, 59, 0.45);
      }

      .app-card h2,
      .app-card h3 {
        color: var(--app-text);
      }

      .app-table thead th {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--app-text-muted);
        border-bottom: 1px solid var(--app-border);
        background-color: transparent;
      }

      .app-table tbody td {
        vertical-align: middle;
        border-color: rgba(226, 232, 240, 0.7);
      }

      .text-snippet {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 0.95rem;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.65rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.2s ease, color 0.2s ease;
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chip + .chip {
        margin-left: 0.4rem;
      }

      .chip-link {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .chip-link:hover {
        background: #bfdbfe;
        color: #1e40af;
      }

      .chip-neutral {
        background: #e2e8f0;
        color: #334155;
      }

      .info-title {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--app-text-muted);
        margin-bottom: 0.5rem;
      }

      .info-panel {
        background: #f8fafc;
        border: 1px solid var(--app-border);
        border-radius: 16px;
        padding: 1rem 1.25rem;
      }

      .snippet-block {
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 14px;
        border: none;
        padding: 1rem 1.25rem;
        max-height: 260px;
        overflow: auto;
        font-size: 0.92rem;
      }

      .preview-frame {
        border: 1px solid var(--app-border);
        border-radius: 18px;
        overflow: hidden;
        background: #ffffff;
      }

      .preview-frame iframe {
        width: 100%;
        min-height: 650px;
        border: 0;
      }

      .empty-state {
        padding: 4rem 2rem;
        text-align: center;
      }

      .empty-state-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 1.5rem;
        border-radius: 50%;
        background: #dbeafe;
        color: #1d4ed8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.85rem;
        box-shadow: inset 0 0 0 1px rgba(29, 78, 216, 0.12);
      }

      @media (max-width: 768px) {
        .app-shell {
          padding: 20px 18px 36px;
        }

        .app-header {
          padding: 24px;
          border-radius: 20px;
        }

        .app-card {
          padding: 20px;
          border-radius: 18px;
        }

        .chip + .chip {
          margin-left: 0;
          margin-top: 0.4rem;
        }
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap">
          <div>
            <div class="eyebrow">Summary Archive</div>
            <h1>摘要存档服务</h1>
            <p>归档生成的摘要，快速检索相关网址与附件，便于复用与协作。</p>
          </div>
          <div class="header-action text-nowrap">
            {% block header_actions %}
              <a class="btn btn-outline-primary btn-lg" href="{{ url_for('index') }}">摘要列表</a>
            {% endblock %}
          </div>
        </div>
      </header>
      <main class="app-main">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
